services:
  xray-proxy:
    image: teddysun/xray:latest
    container_name: vozducraft-xray-proxy
    restart: unless-stopped
    volumes:
      - ./xray-config.json:/etc/xray/config.json
    ports:
      - "10808:10808"
      - "10809:10809"

  vozducraft-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vozducraft-master-api
    restart: unless-stopped
    depends_on:
      - xray-proxy
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/vozducraft.db
      - JWT_SECRET=VOZDUCRAFT_SUPER_SECURE_JWT_SECRET_2026
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_PROXY=http://xray-proxy:10809
    volumes:
      # Постоянное хранение базы данных SQLite
      - ./data:/app/data
      # Постоянное хранение загруженных модов и патчей лаунчера
      - ./backend/public/files:/app/public/files
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/manifest/servers"]
      interval: 15s
      timeout: 5s
      retries: 3
